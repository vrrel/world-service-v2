media:
  input: public
  output: /

content:
  # ==========================================
  # KONFIGURASI PLAYERS (JSON)
  # ==========================================
  - name: players
    label: Players List
    type: file # Diperbaiki: Root content hanya bisa 'collection' (folder) atau 'file' (file tunggal)
    path: src/data/players.json
    fields:
      # Diperbaiki: Tambahkan pembungkus object list agar bisa membaca array di dalam file JSON
      - name: data
        label: Players Data
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - name: role
            label: Role
            type: select
            options:
              values:
                - { label: "CC (Content Creator)", value: "CC" }
                - { label: "DEV (Developer)", value: "Dev" }
                - { label: "MOD (Moderator)", value: "Mod" }
          - name: bio
            label: Biography
            type: string # Diperbaiki: 'text' bukan tipe standar, gunakan 'string'
          - name: image
            label: Player Image
            type: image
            options:
              path: player # Diperbaiki: Menggantikan 'image_dir' dan 'public_path'
          - name: admin
            label: Admin Roles
            type: select # Diperbaiki: Gunakan select multi-pilih alih-alih type: list bersarang
            options:
              multiple: true
              values:
                [
                  Owner,
                  Builder,
                  Composer,
                  Coordinator,
                  Worker,
                  Hoster,
                  Artist,
                  Developer,
                  Server Admin,
                  Police,
                  Brand Ambassador,
                ]
          - name: testimoni
            label: Is Testimonial?
            type: boolean
            default: false
          - name: quote
            label: Quote / Testimonial Text
            type: string
          - name: ROTD
            label: ROTD Scores
            type: object
            fields:
              - { name: art, label: Art, type: number }
              - { name: music, label: Music, type: number }
              - { name: parkour, label: Parkour, type: number }
              - { name: special, label: Special, type: number }
              - { name: story, label: Story, type: number }

  # ==========================================
  # KONFIGURASI SHOWCASES (JSON)
  # ==========================================
  - name: showcases
    label: Showcases Gallery
    type: file # Diperbaiki dari 'list'
    path: src/data/showcases.json
    fields:
      - name: data
        label: Showcases Data
        type: object
        list: true
        fields:
          - {
              name: label,
              label: World ID / Label,
              type: string,
              required: true,
            }
          - name: src
            label: Showcase Image
            type: image
            options:
              path: showcase # Diperbaiki dari 'image_dir'

  # ==========================================
  # KONFIGURASI BLOG POSTS (MARKDOWN)
  # ==========================================
  - name: posts
    label: Blog Posts
    type: collection # Sesuai dengan referensi yang benar
    path: content/posts # Diperbaiki: PagesCMS menggunakan 'path', bukan 'folder'
    filename: "{fields.title}.md" # Ditambahkan agar CMS tahu format penamaan file baru
    view:
      fields: [title, date, author] # Opsional: Memudahkan tampilan list di dashboard CMS
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: excerpt
        label: Description / Excerpt
        type: string # Diperbaiki dari 'text'
        required: true
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: updated
        label: Updated Date
        type: date
      - name: author
        label: Author
        type: string
        required: true
      - name: image
        label: Featured Image
        type: image
        options:
          path: blog/images # Pastikan folder ini disesuaikan dengan kebutuhan Anda
      - name: urlYoutube
        label: YouTube URL (Opsional)
        type: string
      - name: tags
        label: Tags
        type: select # Diperbaiki: Agar UI di CMS menjadi input tag/chip yang rapi
        options:
          creatable: true
          multiple: true
          values: [Investment, News, Tips, Guide, Crystal Realms, Builder, Composer]
      - name: draft
        label: Status Draft
        type: boolean
        default: false
      - name: body
        label: Content
        type: rich-text
