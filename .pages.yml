media:
  input: public
  output: /

content:
  - name: players
    label: Players List
    type: list
    path: src/data/players.json
    exclude_index: true
    layout: table
    view:
      title: name
      description: bio
      image: image
    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: role
        label: Role
        type: select
        required: false
        options:
          - label: CC (Content Creator)
            value: CC
          - label: DEV (Developer)
            value: DEV
          - label: MOD (Moderator)
            value: MOD
          - label: None / Player
            value: ""

      - name: bio
        label: Biography
        type: text
        required: false

      - name: image
        label: Player Image
        type: image
        image_dir: public/player
        public_path: /player
        required: true

      - name: admin
        label: Admin Roles
        type: list
        required: false
        field:
          type: select
          label: Role Name
          options:
            - Owner
            - Builder
            - Composer
            - Coordinator
            - Developer
            - Hosting
            - Police
            - Server Admin

      - name: testimoni
        label: Is Testimonial?
        type: boolean
        required: false
        default: false

      - name: quote
        label: Quote / Testimonial Text
        type: text
        required: false

      - name: ROTD
        label: ROTD Scores
        type: object
        required: false
        fields:
          - name: special
            label: Special
            type: number
            required: false
          - name: parkour
            label: Parkour
            type: number
            required: false
          - name: story
            label: Story
            type: number
            required: false
          - name: art
            label: Art
            type: number
            required: false

  - name: showcases
    label: Showcases Gallery
    type: list
    path: src/data/showcases.json
    exclude_index: true
    layout: grid
    view:
      title: label
      image: src
    fields:
      - name: label
        label: World ID / Label
        type: string
        required: true

      - name: src
        label: Showcase Image
        type: image
        image_dir: public/showcase
        public_path: /showcase
        required: true

  - name: posts
    label: Blog Posts
    type: collection
    folder: content/posts
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: excerpt
        label: Description / Excerpt
        type: text
        required: true

      - name: date
        label: Publish Date
        type: date
        required: true

      - name: updated
        label: Updated Date
        type: date

      - name: author
        label: Author
        type: string
        required: true

      - name: image
        label: Featured Image
        type: image

      - name: urlYoutube
        label: YouTube URL (Opsional)
        type: string

      - name: tags
        label: Tags
        type: string
        list: true

      - name: draft
        label: Status Draft
        type: boolean
        default: false

      - name: body
        label: Content
        type: rich-text
